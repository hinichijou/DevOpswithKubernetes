apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: wikipedia-todo
            image: hinichijou/wikipedia_todo_job:gtioyq7v
            env:
              - name: WIKIPEDIA_URL
                value: "https://en.wikipedia.org/wiki/Special:Random"
              - name: POST_TODO_URL
                value: "http://todoapp-backend-svc:3001/api/todos"
          restartPolicy: OnFailure