apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
images:
  - name: PROJECT/FRONTENDIMAGE
    newName: hinichijou/todo_app_frontend:t8u50v6h
  - name: PROJECT/BACKENDIMAGE
    newName: hinichijou/todo_app_backend:o1h4u8ik
  - name: PROJECT/WIKIPEDIATODOJOBIMAGE
    newName: hinichijou/wikipedia_todo_job:gtioyq7v
  - name: PROJECT/DBBACKUPJOBIMAGE
    newName: hinichijou/db_backup_job:qu9l0stc
configMapGenerator:
- name: db-init
  files:
  - manifests/init_todo_db.sql
resources:
  - manifests/gateway.yaml
  - manifests/persistentvolumeclaim_todoapp.yaml
  - manifests/configmap_todoapp.yaml
  - manifests/deployment_todoapp.yaml
  - manifests/route_frontend.yaml
  - manifests/route_backend.yaml
  - manifests/service_todoapp.yaml
  - manifests/service_postgres.yaml
  - manifests/statefulset_postgres.yaml
  # Deployment to GKE is done by decrypting enc_secret_postgres.yaml and applying it directly in the GitHub workflow. Uncomment for local use.
  - manifests/secret_postgres.yaml
  - manifests/configmap_postgres.yaml
  - manifests/wikipedia_todo_job.yaml
  - manifests/db_backup_job.yaml
  # Healthcheckpolicy is a GKE component. Uncomment when deploying to GKE unless using some alternative for defining health check paths.
  # - manifests/healthcheckpolicies.yaml