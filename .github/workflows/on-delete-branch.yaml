name: Delete deployed environment on delete branch

on:
  delete:
  workflow_dispatch:
    inputs:
      delete_deployment:
        description: Delete the environment that matches the name of the current branch.
        required: true
        type: boolean
        default: false

permissions:
  id-token: write

env:
  PROJECT_ID: "${{ secrets.GKE_PROJECT }}"
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  MAIN_NAMESPACE: project

jobs:
  delete-env:
    name: Delete environment for branch
    if: github.event.ref_type == 'branch' || inputs.delete_deployment
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: 'Set name for namespace on delete event'
        # The contents of GITHUB_REF_NAME and github.event.ref are different depending on what the triggering event is
        run: |-
          if [ ${{ inputs.delete_deployment }} ]; then
            BRANCH = "$GITHUB_REF_NAME"
          else
            BRANCH = "${{ github.event.ref }}"
          fi

          if [ "$BRANCH" == "main" ]; then
            echo "NAMESPACE=$MAIN_NAMESPACE" >> $GITHUB_ENV
          else
            echo "NAMESPACE=$BRANCH" >> $GITHUB_ENV
          fi

      - name: Delete
        run: |-
          kubectl get services -o wide -n $NAMESPACE
          kubectl delete namespace -n $NAMESPACE
          kubectl get services -o wide -n $NAMESPACE