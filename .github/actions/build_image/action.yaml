name: 'Build Image'
description: 'Builds images and adds them to kustomization.yaml'
inputs:
  namespace:
    required: true
  image_name:
    required: true
  app_folder:
    required: true
  kustomization_folder:
    required: true
  build_folder:
    required: true
  image_alias:
    required: true

runs:
  using: "composite"
  steps:
    - name: Build & push
      id: 'build'
      working-directory: "${{ inputs.app_folder }}"
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.namespace }}/${{ inputs.image_name }}"
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        docker build --tag $IMAGE_TAG "${{ inputs.build_folder }}"
        docker push $IMAGE_TAG

    - name: Set to kustomization
      working-directory: "${{ inputs.kustomization_folder }}"
      shell: bash
      run: kustomize edit set image "${{ inputs.image_alias }}"=${{ steps.build.outputs.image_tag }}