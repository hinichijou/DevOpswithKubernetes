name: 'Build Image'
description: 'Builds images and adds them to kustomization.yaml'
inputs:
  namespace:
    required: true
  image_name:
    required: true
  kustomization_folder:
    required: true
  build_folder:
    required: true
  image_alias:
    required: true

runs:
  using: "composite"
  steps:
    - name: Run bash commands
      # Assumes that the kustomize file is in the working directory root
      working-directory: "${{ inputs.kustomization_folder }}"
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.namespace }}/${{ inputs.image_name }}"
        docker build --tag $IMAGE_TAG "${{ inputs.build_folder }}"
        docker push $IMAGE_TAG
        kustomize edit set image "${{ inputs.image_alias }}"=$IMAGE_TAG