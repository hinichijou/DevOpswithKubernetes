name: 'Fetch Image'
description: 'Fetches existing image from repository or builds if not found and adds image to kustomization.yaml'
inputs:
  namespace:
    required: true
  image_name:
    required: true
  app_folder:
    required: true
  build_folder:
    required: true
  image_alias:
    required: true
  build_arg_string:
    required: false
  # booleans are not supported in composite action inputs: https://github.com/actions/runner/issues/2238
  force_build:
    required: true
outputs:
  image:
    value: "${{ steps.output.outputs.output }}"


runs:
  using: "composite"
  steps:
    - name: Fetch existing image SHA
      id: 'sha'
      if: ${{ inputs.force_build == 'false' }}
      shell: bash
      run: |
        echo "image_sha=$(curl -s https://hub.docker.com/v2/namespaces/${{ inputs.namespace }}/repositories/${{ inputs.image_name }}/tags | jq '.results | sort_by(.last_pushed) | .[0].digest')" >> $GITHUB_OUTPUT

    - name: Build image (if existing not found or force build)
      id: 'build'
      if: inputs.force_build == 'true'  || steps.sha.outputs.image_sha == ''
      uses: ./.github/actions/build_image
      with:
        namespace: "${{ inputs.namespace }}"
        image_name: "${{ inputs.image_name }}"
        app_folder: "${{ inputs.app_folder }}"
        build_folder: "${{ inputs.build_folder }}"
        image_alias: "${{ inputs.image_alias }}"
        build_arg_string: "${{ inputs.build_arg_string }}"

    - name: Output image
      id: 'output'
      shell: bash
      run: |
        if [ -n "${{ steps.sha.outputs.image_sha }}" ]; then
          IMAGE_PATH="${{ inputs.namespace }}/${{ inputs.image_name }}"
          echo "output=${{ inputs.image_alias }}=$IMAGE_PATH@${{ steps.sha.outputs.image_sha }}" >> $GITHUB_OUTPUT
        else
          echo "output=${{ steps.build.outputs.built }}" >> $GITHUB_OUTPUT
        fi